[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academy-permission-registry-1908"
version = "1.0.0"
description = "ClawHunt #1908 academy permission registry and role default mapping demo"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "psycopg2-binary>=2.9",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8",
]

[project.scripts]
academy-registry-check = "scripts.check_registry:main"
academy-export-matrix = "scripts.export_matrix:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
